  /api/v2/profile/email:
    get:
      description: >-
        Cost: 3 credits / successful request.
        Look up the work email address of a Person Profile.

        Email addresses returned are verified to not be role-based or catch-all emails. Email addresses
        returned by our API endpoint come with a 95+% deliverability guarantee.

        **Endpoint behavior**

        *This endpoint does not always return results immediately.*

        If you provided a webhook in your request parameter, our application will call your webhook with
        the result once. See **Callback** section below.
      parameters:
        - in: query
          name: profile_url
          required: true
          description: >-
            Profile URL of the person you want to
            extract work email address from.
          example: https://www.linkedin.com/in/williamhgates
          schema:
            type: string
        - in: query
          name: callback_url
          required: false
          description: >-
            Webhook to notify your application when
            the request has finished processing.
          example: https://webhook.site/29e12f17-d5a2-400a-9d08-42ee9d83600a
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractionEmailResult'
              example:
                email_queue_count: 0
          description: Work Email Address
        '400':
          description: Invalid parameters provided. Refer to the documentation and message body for more info
        '401':
          description: Invalid API key
        '403':
          description: You have run out of credits
        '404':
          description: 'The requested resource (e.g: user profile, company) could not be found'
        '429':
          description: Rate limited. Please retry
        '500':
          description: Internal Server Error
        '503':
          description: Enrichment failed, please retry.
      callbacks:
        workEmailResult:
          "{$request.query.callback_url}":
            post:
              requestBody:
                required: true
                description: >-
                  Sent when processing completes if `callback_url` was set on the initial request.
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        email:
                          type: string
                          description: Work email address found (if any).
                          example: email@domain.com
                        status:
                          type: string
                          description: >
                            Status of the lookup: `email_found` when a work email was found, or
                            `email_not_found` when none was found.
                          enum:
                            - email_found
                            - email_not_found
                          example: email_found
                        profile_url:
                          type: string
                          description: Profile URL paired with the work email returned.
                          example: https://www.linkedin.com/in/williamhgates
              responses:
                '200':
                  description: >-
                    Your server acknowledged the callback (e.g. JSON or other body). Treated as success.
                '201':
                  description: >-
                    Your server acknowledged the callback with a created resource. Treated as success.
                '204':
                  description: >-
                    Your server acknowledged the callback with no response body. Treated as success.
      tags:
        - Contact API
      operationId: Work Email Lookup Endpoint
    summary: Work Email Lookup Endpoint
