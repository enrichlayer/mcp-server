      deprecated: true
      description: >-
        Cost: 10 credits /
        Company Profile URL for users on an annual subscription or Enterprise plan.
        Get a list of probable customers of the target company. Available for users on an annual subscription or Enterprise plan.
      parameters:
        - in: query
          name: company_profile_url
          required: false
          description: >-
            The Profile URL of the company from which you want to get a list of customers of.


            Include only one of: `company_profile_url` or `twitter_profile_url`.
          example: https://www.linkedin.com/company/watsons
          schema:
            type: string
        - in: query
          name: twitter_profile_url
          required: false
          description: >-
            The Twitter/X Profile URL belonging to the company that you want to get a list of customers of.

            URL should be in the format of `https://x.com/<public-identifier>`


            Include only one of: `company_profile_url` or `twitter_profile_url`.
          example: https://x.com/watsonsproperty
          schema:
            type: string
        - in: query
          name: page_size
          required: false
          description: >-
            Limit the maximum results of customer companies returned per API call.

            The default value of this parameter is 10.

            Accepted values for this parameter is an integer ranging from 0 to 1000.
          example: '10'
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerList'
              example:
