  /api/v2/profile/resolve:
    get:
      description: >-
        Cost: 2 credits / successful request.
        Look up a person with a name and company information.
        Credits are charged by default even when no match is found; use
        `similarity_checks=skip` to avoid charges on null results.
      parameters:
        - in: query
          name: company_domain
          required: true
          description: Company name or domain
          example: gatesfoundation.org
          schema:
            type: string
        - in: query
          name: first_name
          required: true
          description: First name of the user
          example: Bill
          schema:
            type: string
        - in: query
          name: similarity_checks
          required: false
          description: >-
            Controls whether the API endpoint performs
            similarity comparisons between the input parameters
            and the results or simply returns the closest match.
            For instance, if you are searching for a person named
            "Jane Smith", and the closest result we have is "Tom
            Garcia", our similarity checks will discard the obviously
            incorrect result and return `null` instead of a false
            positive.

            Include similarity checks to eliminate false positives.
            However, be aware that this might yield fewer results
            as false positives are discarded. Credits will still be
            deducted even if we return `null`.

            You can choose to skip similarity checks, in which
            case no credits will be charged if we return `null`.

            This parameter accepts the following values:

            * `include` (default) - Perform similarity checks and
            discard false positives. Credits will be deducted even
            if we return null .

            * `skip` - Bypass similarity checks. No credits will be
            deducted if no results are returned.
          example: include
          schema:
            type: string
        - in: query
          name: enrich_profile
          required: false
          description: >-
            Enrich the result with a cached profile of the lookup result.

            The valid values are:

            * `skip` (default): do not enrich the results with cached profile data

            * `enrich`: enriches the result with cached profile data

            Calling this API endpoint with this parameter would add 1 credit.

            If you require fresh profile data,
            please chain this API call with the [People Profile Endpoint](/docs/api/v2/people-api/person-profile) with the `use_cache=if-recent` parameter.
          example: enrich
          schema:
            type: string
        - in: query
          name: location
          required: false
          description: >-
            The location of this user.

            Name of country, city or state.
          example: Seattle
          schema:
            type: string
        - in: query
          name: title
          required: false
          description: Title that user is holding at his/her current job
          example: Co-chair
          schema:
            type: string
        - in: query
          name: last_name
          required: false
          description: Last name of the user
          example: Gates
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonLookupUrlEnrichResult'
              example:
                url: https://www.linkedin.com/in/kevinolearytv
