  /api/v2/find/company/role/:
    get:
      description: >-
        Cost: 3 credits / successful request.
        Returns the profile of a person who most closely matches a specified role
        in a company. For instance, it can identify the "CTO" of
        "Apple". The endpoint returns a single result that represents the closest
        match. Credits are charged on any 200 response, including when no
        matching profile is found. For a detailed comparison, see the
        [Employee Search Endpoint](#company-api-employee-search-endpoint)
        or the [Person Search Endpoint](#search-api-person-search-endpoint).
      parameters:
        - in: query
          name: role
          required: true
          description: Role of the profile that you are looking up
          example: ceo
          schema:
            type: string
        - in: query
          name: company_name
          required: true
          description: Name of the company that you are searching for
          example: microsoft
          schema:
            type: string
        - in: query
          name: enrich_profile
          required: false
          description: >-
            Enrich the result with a cached profile of the lookup result.

            The valid values are:

            * `skip` (default): do not enrich the results with cached profile data

            * `enrich`: enriches the result with cached profile data

            Calling this API endpoint with this parameter would add 1 credit.

            If you require fresh profile data,
            please chain this API call with the [Person Profile Endpoint](#people-api-person-profile-endpoint) with the `use_cache=if-recent` parameter.
          example: enrich
          schema:
            type: string
