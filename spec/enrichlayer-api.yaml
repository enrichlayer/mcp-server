  /api/v2/contact-api/personal-contact:
    get:
      description: >-
        Cost: 1 credit / contact number returned.
        Find personal phone numbers associated with a given social media profile.
      parameters:
        - in: query
          name: profile_url
          required: false
          description: >-
            The Profile URL from which you wish to extract personal
            contact numbers


            Include only one of: `profile_url`, `twitter_profile_url`, or `facebook_profile_url`.
          example: https://www.linkedin.com/in/williamhgates
          schema:
            type: string
        - in: query
          name: twitter_profile_url
          required: false
          description: >-
            The Twitter/X Profile URL from which you wish to extract personal
            contact numbers


            Include only one of: `profile_url`, `twitter_profile_url`, or `facebook_profile_url`.
          example: https://x.com/enrichlayer
          schema:
            type: string
        - in: query
          name: facebook_profile_url
          required: false
          description: >-
            The Facebook Profile URL from which you wish to extract personal
            contact numbers


            Include only one of: `profile_url`, `twitter_profile_url`, or `facebook_profile_url`.
          example: https://www.facebook.com/zuck
          schema:
            type: string
        - in: query
          name: page_size
          required: false
          description: >-
            This controls the maximum number of numbers returned per API call.
            It's useful for limiting credit consumption as the number of numbers
            per identity can vary. The default value is 0, meaning there's no limit
            to the number of returned results.
          example: '0'
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalContactNumbers'
              example:
                numbers:
                  - '+19707495020'
          description: List of Personal Contact Numbers
        '400':
          description: Invalid parameters provided. Refer to the documentation and message body for more info
        '401':
          description: Invalid API key
        '403':
          description: You have run out of credits
        '404':
          description: 'The requested resource (e.g: user profile, company) could not be found'
        '429':
          description: Rate limited. Please retry
        '500':
          description: Internal Server Error
        '503':
          description: Enrichment failed, please retry.
      tags:
        - Contact API
      operationId: Personal Contact Number Lookup Endpoint
    summary: Personal Contact Number Lookup Endpoint
  /api/v2/contact-api/personal-email:
    get:
      description: >-
        Cost: 1 credit / email returned.
        Find personal email addresses associated with a given social media profile.
      parameters:
        - in: query
          name: profile_url
          required: false
          description: >-
            The Profile URL from which you wish to extract personal email addresses.
            Include only one of: `profile_url`, `twitter_profile_url`, or `facebook_profile_url`.
          example: https://www.linkedin.com/in/williamhgates
          schema:
            type: string
        - in: query
          name: twitter_profile_url
          required: false
          description: >-
            The Twitter/X Profile URL from which you wish to extract personal email addresses.
            Include only one of: `profile_url`, `twitter_profile_url`, or `facebook_profile_url`.
          example: https://x.com/enrichlayer
          schema:
            type: string
        - in: query
          name: facebook_profile_url
          required: false
          description: >-
            The Facebook Profile URL from which you wish to extract personal email addresses.
            Include only one of: `profile_url`, `twitter_profile_url`, or `facebook_profile_url`.
          example: https://www.facebook.com/zuck
          schema:
            type: string
        - in: query
          name: email_validation
          required: false
          description: >-
            How to validate each email.

            Takes the following values:
             * `none` (default) - Do not perform email validation.
             * `fast` - Perform fast email validation (does not cost extra credit).
             * `precise` - Perform deliverability validation (costs 1 extra credit per email found).

            For backward-compatibility these are also accepted:
             * `include` - Equivalent to `precise`
             * `exclude` - Equivalent to `none`
          example: include
          schema:
            type: string
        - in: query
          name: page_size
          required: false
          description: This controls the maximum number of emails returned per API call. It's useful for limiting credit consumption as the number of emails per identity can vary. The default value is `0`, meaning there's no limit to the number of returned results.
          example: 0
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PDLEmailResult'
              example:
                emails:
                  - bill.gates@gatesfoundation.org
                  - billg@microsoft.com
                  - billgates@hotmail.com
                invalid_emails: []
          description: List of Personal Emails
        '400':
          description: Invalid parameters provided. Refer to the documentation and message body for more info
        '401':
          description: Invalid API key
        '403':
          description: You have run out of credits
        '404':
          description: 'The requested resource (e.g: user profile, company) could not be found'
        '429':
          description: Rate limited. Please retry
        '500':
          description: Internal Server Error
        '503':
          description: Enrichment failed, please retry.
      tags:
        - Contact API
      operationId: Personal Email Lookup Endpoint
    summary: Personal Email Lookup Endpoint
info:
  title: Enrich Layer API
  version: 1.0.0
openapi: 3.0.0
components:
  schemas:
    CompanyLocation:
      type: object
      properties:
        country:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        postal_code:
          type: string
          nullable: true
        line_1:
          type: string
          nullable: true
        is_hq:
          type: boolean
        state:
          type: string
          nullable: true
      example:
        country: US
        city: Cambridge, MA
        postal_code: '02139-4307'
        line_1: 77 Massachusetts Avenue
        is_hq: true
        state: Massachusetts
    CompanyType:
      type: string
      enum:
        - EDUCATIONAL_INSTITUTION
        - GOVERNMENT_AGENCY
        - NON_PROFIT
        - PARTNERSHIP
        - PRIVATELY_HELD
        - PUBLIC_COMPANY
        - SELF_EMPLOYED
        - SELF_OWNED
    SimilarCompany:
      type: object
      properties:
        name:
          type: string
          nullable: true
        link:
          type: string
          nullable: true
        industry:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
      example:
        name: MIT Sloan School of Management
        link: https://www.linkedin.com/school/mitsloan/
        industry: Higher Education
        location: null
    AffiliatedCompany:
      type: object
      properties:
        name:
          type: string
          nullable: true
        link:
          type: string
          nullable: true
        industry:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
      example:
        name: LinkedIn
        link: https://www.linkedin.com/company/linkedin
        industry: Internet
        location: Sunnyvale, California
    Date:
      type: object
      properties:
        day:
          type: integer
          nullable: true
        month:
          type: integer
          nullable: true
        year:
          type: integer
      example:
        day: 30
        month: 9
        year: 2021
    CompanyUpdate:
      type: object
      properties:
        article_link:
          type: string
          nullable: true
          description: The URL for which the post links out to
        image:
          type: string
          nullable: true
          description: The URL to the image to the post (if it exists)
        posted_on:
          $ref: '#/components/schemas/Date'
          nullable: true
        text:
          type: string
          nullable: true
          description: The body of the update
        total_likes:
          type: integer
          nullable: true
          description: The total likes a post has received
      example:
        article_link: https://lnkd.in/gr7cb5by
        image: https://assets.enrichlayer.com/ll/D5612AQHXKV_XhT0W_A/article-cover_image-shrink_720_1280/B56Zr1w1eSK4AI-/0/1765059814903?e=2147483647&v=beta&t=gKhTu-PogMfQzIvtwIqoJOlm6-05kg63OSE_UosVrrM
        posted_on:
          day: 30
          month: 9
          year: 2021
        text: Introducing Personal Email Lookup API https://lnkd.in/gr7cb5by
        total_likes: 3
    ProfileMeta:
      type: object
      properties:
        thin_profile:
          type: boolean
          nullable: true
          description: >-
            If a profile is classified as a thin profile,
            it means it doesn't contain enough data to be considered a full profile.
        last_updated:
          type: string
          nullable: true
          description: ISO 8601 timestamp since the profile was last fetched.
      example:
        thin_profile: null
        last_updated: '2023-10-26T11:34:30Z'
    LinkedinSchool:
      type: object
      properties:
        linkedin_internal_id:
          type: string
          description: Internal and immutable ID of this Company profile.
        description:
          type: string
          nullable: true
          description: A textual description of the company.
        website:
          type: string
          nullable: true
          description: The URL of the company's website.
        industry:
          type: string
          nullable: true
          description: The `industry` attribute, found in a Company            profile, describes the industry in which the company operates.            The value of this attribute is an enumerator. [See the full list of possible values for this attribute](/docs/guides/industry-values).
        company_size:
          type: array
          items:
            oneOf:
              - type: integer
                nullable: true
              - type: integer
                nullable: true
          minItems: 2
          maxItems: 2
          description: Sequenced range of company head count
        company_size_on_linkedin:
          type: integer
          description: The size of the company.
        hq:
          $ref: '#/components/schemas/CompanyLocation'
          nullable: true
        company_type:
          $ref: '#/components/schemas/CompanyType'
          nullable: true
          description: >-
            Possible values:

            `EDUCATIONAL`: Educational Institution

            `GOVERNMENT_AGENCY`: Government Agency

            `NON_PROFIT` : Nonprofit

            `PARTNERSHIP` : Partnership

            `PRIVATELY_HELD`: Privately Held

            `PUBLIC_COMPANY`: Public Company

            `SELF_EMPLOYED`: Self-Employed

            `SELF_OWNED`: Sole Proprietorship
        founded_year:
          type: integer
          nullable: true
          description: The year the company was founded.
        specialities:
          type: array
          items:
            type: string
          description: A list of specialities.
        locations:
          type: array
          items:
            $ref: '#/components/schemas/CompanyLocation'
        name:
          type: string
          nullable: true
          description: The name of the company.
        tagline:
          type: string
          nullable: true
          description: A short, catchy phrase that represents                the company's mission or brand.
        universal_name_id:
          type: string
          nullable: true
          description: A unique numerical identifier for                the company.
        profile_pic_url:
          type: string
          nullable: true
          description: The URL of the company's profile picture.
        background_cover_image_url:
          type: string
          nullable: true
          description: The URL of the company's background cover image.
        search_id:
          type: string
          description: Unique identifier used for search operations.
        similar_companies:
          type: array
          items:
            $ref: '#/components/schemas/SimilarCompany'
        affiliated_companies:
          type: array
          items:
            $ref: '#/components/schemas/AffiliatedCompany'
        updates:
          type: array
          items:
            $ref: '#/components/schemas/CompanyUpdate'
          description: A list of post updates made by the company. This field is not guaranteed to be returned. Do not rely on this attribute in production.
        follower_count:
          type: integer
          nullable: true
          description: The number of followers                the company has.
        meta:
          $ref: '#/components/schemas/ProfileMeta'
          description: Profile metadata.
      example:
        linkedin_internal_id: '1503'
        description: "The Massachusetts Institute of Technology (MIT) is a private research university located in Cambridge, Massachusetts. MIT is devoted to the advancement of knowledge and education of students in areas that contribute to or prosper in an environment of science and technology."
        website: http://web.mit.edu/
        industry: Higher Education
        company_size:
          - 5001
          - 10000
        company_size_on_linkedin: 23329
        hq:
          country: US
          city: Cambridge, MA
          postal_code: '02139-4307'
          line_1: 77 Massachusetts Avenue
          is_hq: true
          state: Massachusetts
        company_type: EDUCATIONAL_INSTITUTION
        founded_year: 1861
        specialities:
          - education
          - science
          - research
          - engineering
        locations:
