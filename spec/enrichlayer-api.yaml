  /api/v2/company/employee/search/:
    get:
      description: >-
        Cost: 10 credits / successful request.
        Search employees of a target company by their job title. This API endpoint is syntactic
        sugar for the `role_search` parameter under the [Employee Listing Endpoint](#company-api-employee-listing-endpoint).
        For a detailed comparison, see the [Role Lookup Endpoint](#people-api-role-lookup-endpoint) or the [Person Search Endpoint](#search-api-person-search-endpoint).
      parameters:
        - in: query
          name: company_profile_url
          required: true
          description: Profile URL of the target company.
          example: https://www.linkedin.com/company/microsoft/
          schema:
            type: string
        - in: query
          name: keyword_boolean
          required: true
          description: >-
            Job title keyword to search for in Boolean Search Syntax format.
            This parameter will take precedence over `keyword_regex` parameter if both are provided.

            The value provided for this parameter must not exceed 255 characters.

            This parameter is **case-insensitive**; matching ignores capitalization in both the input and our data.
          example: ceo OR cto
          schema:
            type: string
        - in: query
          name: keyword_regex
          required: false
          deprecated: true
          description: >-
            Use `keyword_boolean` instead.

            Job title keyword to search for in regular expression format.

            The accepted value for this parameter is a **case-insensitive** regular expression.
          example: ceo|cto
          schema:
            type: string
        - in: query
          name: page_size
          required: false
          description: >-
            Tune the maximum results returned per API call.
            The default value of this parameter is `10`.
            Accepted values for this parameter is an integer ranging from `1` to `9999`.
            When `enrich_profiles=enrich`, this parameter accepts value ranging from `1` to `10` and the default value is `10`.
          example: '10'
          schema:
            type: string
        - in: query
          name: country
          required: false
          description: >-
            Limit the result set to the country locality of the profile. For example, set the parameter of `country=us` if you only want profiles from the US.

            This parameter accepts a case-insensitive [Alpha-2 ISO3166 country code](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2).

            Costs an extra `3` credit per result returned.
          example: us
          schema:
            type: string
        - in: query
          name: enrich_profiles
          required: false
          description: >-
            Get the full profile of employees instead of only their profile urls.

            Each request respond with a streaming response of profiles.

            The valid values are:

            * `skip` (default): lists employee's profile url

            * `enrich`: lists full profile of employees

            Calling this API endpoint with this parameter would add `1` credit per employee returned.
          example: enrich
          schema:
            type: string
        - in: query
          name: resolve_numeric_id
          required: false
          description: >-
            Enable support for Company Profile URLs with numerical IDs.

            This parameter accepts the following values:

            - `false` (default value) - Will not resolve numerical IDs.

            - `true` - Enable support for Company Profile URLs with numerical IDs. 
            Costs an extra `2` credit on top of the base cost of the endpoint.
          example: 'false'
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeList'
              example:
                employees:
                  - profile_url: https://www.linkedin.com/in/satyanadella
                    profile:
                      public_identifier: williamhgates
                      profile_pic_url: https://assets.enrichlayer.com/pp/profilepic/a41217d5753de1f3f4906f9da43dbad6
