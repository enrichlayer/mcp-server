  /api/v2/search/company:
    get:
      description: >-
        Cost: 3 credits / Company URL.
        Search for companies that meet a set of criteria within
        our exhaustive dataset of company profiles.

        This API endpoint can return at most 10,000,000 results per search.

        Each search expression for a parameter is limited to a maximum of 255 characters. Search expressions follow the Boolean Search Syntax.
      parameters:
        - in: query
          name: country
          required: false
          description: >-
            Filter companies with an office based in this country.
            This parameter accepts a case-insensitive [Alpha-2 ISO3166 country code](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2).
          example: US
          schema:
            type: string
        - in: query
          name: region
          required: false
          description: >-
            Filter companies with an office based in this region.
            A “region” in this context means “state,” “province,” or similar political division, depending on what country you’re querying.
          example: Maryland OR "New York"
          schema:
            type: string
        - in: query
          name: city
          required: false
          description: Filter companies based in cities matching the provided search expression.
          example: '"Los Angeles"'
          schema:
            type: string
        - in: query
          name: type
          required: false
          description: >-
            Filter companies of the provided type.

            Possible values:

            * `EDUCATIONAL`: Educational Institution

            * `GOVERNMENT_AGENCY`: Government Agency

            * `NON_PROFIT` : Nonprofit

            * `PARTNERSHIP` : Partnership

            * `PRIVATELY_HELD` : Privately Held

            * `PUBLIC_COMPANY` : Public Company

            * `SELF_EMPLOYED` : Self-Employed

            * `SELF_OWNED` : Sole Proprietorship
          example: PRIVATELY_HELD
          schema:
            type: string
        - in: query
          name: follower_count_min
          required: false
          description: Filter companies with a follower count of **more than** this value.
          example: '1000'
          schema:
            type: string
        - in: query
          name: follower_count_max
          required: false
          description: Filter companies with a follower count **less than** this value.
          example: '10000'
          schema:
            type: string
        - in: query
          name: name
          required: false
          description: Filter companies with a name matching the provided search expression.
          example: circle || amelex
          schema:
            type: string
        - in: query
          name: industry
          required: false
          description: >-
            Filter companies belonging to an `industry` that matches the provided search expression. The `industry` attribute, found in a Company profile, describes the primary industry in which the company operates. The value of this attribute is an enumerator. [See the full list of possible values for this attribute](/docs/guides/industry-values).

            We also infer a company's industry from various attributes. For example, the primary industry for `https://www.linkedin.com/company/apple` may be `Computers and Electronics Manufacturing`, but we may also classify it under `Software Development`.

            If you want to filter by the primary industry only, please refer to the `primary_industry` parameter.
          example: technology || manufacturing
          schema:
            type: string
        - in: query
          name: primary_industry
          required: false
          description: Filter companies that has an industry that matches the provided search expression as the primary industry. The `industry` attribute, found in a Company profile, describes the primary industry in which the company operates. The value of this attribute is an enumerator. [See the full list of possible values for this attribute](/docs/guides/industry-values).
          example: software development
          schema:
            type: string
        - in: query
          name: specialities
          required: false
          description: >-
            Filter companies that have a speciality that matches the provided search expression.

            Please note that we use the spelling `specialities` rather than `specialties` in this document.
          example: innovative product development
          schema:
            type: string
        - in: query
          name: employee_count_category
          required: false
          description: >-
            Filter companies based on their employee count category.

            This parameter will take precedence over `employee_count_min` and `employee_count_max` parameters.

            The valid values are:

            - `custom` (default): uses `employee_count_min` and `employee_count_max` parameters

            - `startup`: 1-10 employees

            - `small`: 11-50 employees

            - `medium`: 51-250 employees

            - `large`: 251-1000 employees

            - `enterprise`: 1001+ employees
          example: startup
          schema:
            type: string
        - in: query
          name: employee_count_max
          required: false
          description: Filter companies with **at most** this many employees.
          example: '1000'
          schema:
            type: string
        - in: query
          name: employee_count_min
          required: false
          description: Filter companies with **at least** this many employees.
          example: '100'
          schema:
            type: string
        - in: query
          name: description
          required: false
          description: Filter companies with a description matching the provided search expression.
          example: navy or naval
          schema:
            type: string
        - in: query
          name: founded_after_year
          required: false
          description: Filter companies founded **after** this year.
          example: '1985'
          schema:
            type: string
        - in: query
          name: founded_before_year
          required: false
          description: Filter companies founded **before** this year.
          example: '2015'
          schema:
            type: string
        - in: query
          name: funding_amount_max
          required: false
          description: Filter companies that have raised **at most** this much (USD) funding amount.
          example: '1000000'
          schema:
            type: string
        - in: query
          name: funding_amount_min
          required: false
          description: Filter companies that have raised **at least** this much (USD) funding amount.
          example: '1000000'
          schema:
            type: string
        - in: query
          name: funding_raised_after
          required: false
          description: Filter companies that have raised funding **after** this date.
          example: '2019-12-30'
          schema:
            type: string
        - in: query
          name: funding_raised_before
          required: false
          description: Filter companies that have raised funding **before** this date.
          example: '2019-12-30'
          schema:
            type: string
        - in: query
          name: public_identifier_in_list
          required: false
          description: >-
            A list of public identifiers (the identifying portion of the company’s profile URL).
            The target company’s identifier must be a member of this list.
          example: stripe,amazon
          schema:
            type: string
        - in: query
          name: public_identifier_not_in_list
          required: false
          description: >-
            A list of public identifiers (the identifying portion of the company’s profile URL).
            The target company’s identifier must **not** be a member of this list.
          example: stripe,amazon
          schema:
            type: string
        - in: query
          name: domain_name
          required: false
          description: Filter companies with a domain name matching the provided search expression.
          example: pfizer.com
          schema:
            type: string
        - in: query
          name: page_size
          required: false
          description: >-
            Tune the maximum results returned per API call.

            The default value of this parameter is 100.

            Accepted values for this parameter is an integer ranging from 1 to 100.

            When `enrich_profiles=enrich`, this parameter accepts value ranging from `1` to `10`.
          example: '10'
