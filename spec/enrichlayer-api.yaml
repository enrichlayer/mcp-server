  /api/v2/company/job:
    get:
      description: >-
        Cost: 2 credits / successful request.
        List jobs posted by a company.
      parameters:
        - in: query
          name: job_type
          required: false
          description: >-
            The nature of the job.
            It accepts the following 7 case-insensitive values only:

            - `full-time`

            - `part-time`

            - `contract`

            - `internship`

            - `temporary`

            - `volunteer`

            - `anything` (default)
          example: full-time
          schema:
            type: string
        - in: query
          name: experience_level
          required: false
          description: >-
            The experience level needed for the job.
            It accepts the following 6 case-insensitive values only:

            - `internship`

            - `entry_level`

            - `associate`

            - `mid_senior_level`

            - `director`

            - `anything` (default)
          example: mid_senior_level
          schema:
            type: string
        - in: query
          name: when
          required: false
          description: >-
            The time when the job is posted,
            It accepts the following case-insensitive values only:

            - `yesterday`

            - `past-week`

            - `past-month`

            - `anytime` (default)
          example: past-month
          schema:
            type: string
        - in: query
          name: flexibility
          required: false
          description: >-
            The flexibility of the job.
            It accepts the following 3 case insensitive values only:

            - `remote`

            - `on-site`

            - `hybrid`

            - `anything` (default)
          example: remote
          schema:
            type: string
        - in: query
          name: geo_id
          required: false
          description: >-
            The `geo_id` of the location to search for.
            For example, `92000000` is the `geo_id` of world wide.
          example: '92000000'
          schema:
            type: string
        - in: query
          name: keyword
          required: false
          description: The keyword to search for.
          example: engineer
          schema:
            type: string
        - in: query
          name: search_id
          required: false
          description: >-
            The `search_id` of the company.
            You can get the `search_id` of a company via
            [Company Profile API](#company-api-company-profile-endpoint).
          example: '1035'
          schema:
            type: string
        - in: query
          name: pagination
          required: false
          description: >-
            The token for fetching the next page of results.

            Take the value of the `pagination` query parameter from the `next_page_api_url` of the previous response.
