servers:
  - url: https://enrichlayer.com
    description: Enrich Layer API Server
security:
  - BearerAuth:
      - client
paths:
  /api/v2/school:
    get:
      description: >-
        Cost: 1 credit / successful request.
        Get structured data of a School Profile.
      parameters:
        - in: query
          name: url
          required: true
          description: URL of the School Profile to crawl.
          example: https://www.linkedin.com/school/mit
          schema:
            type: string
        - in: query
          name: use_cache
          required: false
          description: >-
            `if-present` The default behavior.Fetches profile from cache regardless of age of profile. If profile is not available in cache, API will attempt to source profile externally.

            `if-recent` API will make a best effort to return a fresh profile no older than 29 days.Costs an extra `1` credit on top of the cost of the base endpoint.
          example: if-present
          schema:
            type: string
        - in: query
          name: live_fetch
          required: false
          description: >-
            Tweak the behavior of the API to fetch the fresh profile.

            This parameter accepts the following values:

            * `force` - Force the API to fetch the fresh profile.
            Costs an extra `9` credits on top of the cost of the base endpoint.

            * `default` (default value) - Do not force the API to fetch the fresh profile. Consider using `use_cache` instead.
          example: force
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkedinSchool'
              example:
                linkedin_internal_id: '1503'
                description: "The Massachusetts Institute of Technology (MIT) is a private research university located in Cambridge, Massachusetts. MIT is devoted to the advancement of knowledge and education of students in areas that contribute to or prosper in an environment of science and technology."
                website: http://web.mit.edu/
                industry: Higher Education
                company_size:
                  - 5001
                  - 10000
                company_size_on_linkedin: 23329
                hq:
                  country: US
                  city: Cambridge, MA
                  postal_code: '02139-4307'
                  line_1: 77 Massachusetts Avenue
                  is_hq: true
                  state: Massachusetts
                company_type: EDUCATIONAL_INSTITUTION
                founded_year: 1861
                specialities:
                  - education
                  - science
                  - research
                  - engineering
                locations:
                  - country: US
                    city: Cambridge
                    postal_code: '02139'
                    line_1: Massachusetts Ave
                    is_hq: true
                    state: Massachusetts
                name: Massachusetts Institute of Technology
                tagline: null
                universal_name_id: mit
                profile_pic_url: https://assets.enrichlayer.com/pp/profilepic/35d64df1cce08965de8b857ecc88d2ff
                background_cover_image_url: null
                search_id: '1503'
                similar_companies:
                  - name: MIT Sloan School of Management
                    link: https://www.linkedin.com/school/mitsloan/
                    industry: Higher Education
                    location: null
                  - name: MIT School of Engineering
                    link: https://www.linkedin.com/school/mit-school-of-engineering/
                    industry: Higher Education
                    location: null
                affiliated_companies: []
                updates: []
                follower_count: 539321
                meta:
                  thin_profile: false
                  last_updated: '2023-10-26T11:34:30Z'
          description: Profile data with profile picture, school location, etc
        '400':
          description: Invalid parameters provided. Refer to the documentation and message body for more info
        '401':
          description: Invalid API key
        '403':
          description: You have run out of credits
        '404':
          description: 'The requested resource (e.g: user profile, company) could not be found'
        '429':
          description: Rate limited. Please retry
        '500':
          description: Internal Server Error
        '503':
          description: Enrichment failed, please retry.
      tags:
        - School API
      operationId: School Profile Endpoint
    summary: School Profile Endpoint
  /api/v2/company:
    get:
      description: >-
        Cost: 1 credit / successful request.
        Get structured data of a Company Profile.
      parameters:
        - in: query
          name: url
          required: true
          description: URL Company Profile to crawl.
          example: https://www.linkedin.com/company/google/
          schema:
            type: string
        - in: query
          name: categories
          required: false
          description: >-
            Appends categories data of this company.

            Default value is `"exclude"`.
            The other acceptable value is `"include"`, which will include these categories (if available) for `1` extra credit.
          example: include
          schema:
            type: string
        - in: query
          name: funding_data
          required: false
          description: >-
            Returns a list of funding rounds that this company has received.

            Default value is `"exclude"`.
            The other acceptable value is `"include"`, which will include these categories (if available) for `1` extra credit.
          example: include
          schema:
            type: string
        - in: query
          name: exit_data
          required: false
          description: >-
            Returns a list of investment portfolio exits.

            Default value is `"exclude"`.
            The other acceptable value is `"include"`, which will include these categories (if available) for `1` extra credit.
          example: include
          schema:
            type: string
        - in: query
          name: acquisitions
          required: false
          description: >-
            Provides further enriched data on acquisitions made by this company from external sources.

            Default value is `"exclude"`.
            The other acceptable value is `"include"`, which will include these acquisition data (if available) for `1` extra credit.
          example: include
          schema:
            type: string
        - in: query
          name: extra
          required: false
          description: >-
            Enriches the Company Profile with extra details from external sources.
            Details include Crunchbase ranking, contact email, phone number, Facebook account, Twitter account, funding rounds and amount, IPO status, investor information, etc.

            Default value is `"exclude"`.
            The other acceptable value is `"include"`, which will include these extra details (if available) for `1` extra credit.
          example: include
          schema:
            type: string
        - in: query
          name: use_cache
          required: false
          description: >-
            `if-present` - Fetches profile from cache regardless of age of profile.
            If profile is not available in cache, API will attempt to source profile externally.

            `if-recent` (Default) - API will make a best effort to return a fresh profile no older than 29 days.
            Costs an extra `1` credit on top of the cost of the base endpoint.
          example: if-present
          schema:
            type: string
        - in: query
          name: fallback_to_cache
          required: false
          description: >-
            Tweaks the fallback behavior if an error arises from fetching a fresh profile.

            This parameter accepts the following values:

            * `on-error` (default value) - Fallback to reading the profile from cache if an error arises.

            * `never` - Do not ever read profile from cache.
          example: on-error
          schema:
            type: string
        - in: query
          name: live_fetch
          required: false
          description: >-
            Tweak the behavior of the API to fetch the fresh profile.

            This parameter accepts the following values:

            * `force` - Force the API to fetch the fresh profile.
            Costs an extra `9` credits on top of the cost of the base endpoint.

            * `default` (default value) - Do not force the API to fetch the fresh profile. Consider using `use_cache` instead.
          example: force
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkedinCompany'
              example:
                linkedin_internal_id: '1441'
                description: >-
                  A problem isn't truly solved until it's solved for all. Googlers build products that help create opportunities for everyone, whether down the street or across the globe. Bring your insight, imagination and a healthy disregard for the impossible. Bring everything that makes you unique. Together, we can build for everyone.

                  Check out our career opportunities at careers.google.com.
                website: https://goo.gle/3m1IN7m
