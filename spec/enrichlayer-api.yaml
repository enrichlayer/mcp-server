      parameters:
        - in: query
          name: company_location
          required: false
          description: >-
            The location / region of company.
            ISO 3166-1 alpha-2 codes
          example: sg
          schema:
            type: string
        - in: query
          name: company_domain
          required: false
          description: >-
            Company website or Company domain
            Requires either `company_domain` or `company_name`
