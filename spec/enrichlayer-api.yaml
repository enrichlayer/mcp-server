  /api/v2/search/person:
    get:
      description: >-
        Cost: 3 credits / Profile URL.
        Search for people who meet a set of criteria within our exhaustive dataset of people profiles.

        This API endpoint can return at most 10,000,000 results per search.

        Each search expression for a parameter is limited to a maximum of 255 characters. Search expressions follow the Boolean Search Syntax.
      parameters:
        - in: query
          name: country
          required: false
          description: >-
            Filter people located in this country.
            This parameter accepts a case-insensitive [Alpha-2 ISO3166 country code](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2).
          example: US
          schema:
            type: string
        - in: query
          name: first_name
          required: false
          description: Filter people whose first names match the provided search expression.
          example: Bill OR Mark
          schema:
            type: string
        - in: query
          name: last_name
          required: false
          description: Filter people whose last names match the provided search expression.
          example: Gates or Zuckerberg
          schema:
            type: string
        - in: query
          name: education_field_of_study
          required: false
          description: Filter people with a field of study matching the provided search expression, based on education history.
          example: computer science
          schema:
            type: string
        - in: query
          name: education_degree_name
          required: false
          description: Filter people who earned a degree matching the provided search expression, based on education history.
          example: MBA
          schema:
            type: string
        - in: query
          name: education_school_name
          required: false
          description: Filter people who have attended a school whose name matches the provided search expression, based on education history.
          example: '"Harvard University"'
          schema:
            type: string
        - in: query
          name: education_school_profile_url
          required: false
          description: Filter people who have attended a school with a specific profile URL, based on education history.
          example: https://www.linkedin.com/school/mit/
          schema:
            type: string
        - in: query
          name: current_role_title
          required: false
          description: Filter people who are **currently** working as a role whose title matches the provided search expression. You'll be looking for profiles that show a person's current job. However, keep in mind that some of these profiles may not be up-to-date, which means you might sometimes see a person's old job instead of their current job.
          example: CEO || Founder
          schema:
            type: string
        - in: query
          name: past_role_title
          required: false
          description: Filter people who have **in the past** worked as a role whose title matches the provided search expression.
          example: founder
          schema:
            type: string
        - in: query
          name: current_role_before
          required: false
          description: >-
            Filter people who started their current role **before** this date. You'll be looking for profiles that show a person's current job. However, keep in mind that some of these profiles may not be up-to-date, which means you might sometimes see a person's old job instead of their current job.

            This parameter takes a ISO8601 date. Default value of this parameter is `null`.
          example: '2019-12-30'
          schema:
            type: string
        - in: query
          name: current_role_after
          required: false
          description: >-
            Filter people who started their current role **after** this date. You'll be looking for profiles that show a person's current job. However, keep in mind that some of these profiles may not be up-to-date, which means you might sometimes see a person's old job instead of their current job.

            This parameter takes a ISO8601 date. Default value of this parameter is `null`.
          example: '2019-12-30'
          schema:
            type: string
        - in: query
          name: current_company_profile_url
          required: false
          description: >-
            Filter people who are **currently** working at a company represented by this Company Profile URL.

            Default value of this parameter is `null`.
          example: https://www.linkedin.com/company/apple
          schema:
            type: string
        - in: query
          name: past_company_profile_url
          required: false
          description: >-
            Filter people who have **in the past** worked at the company represented by this Company Profile URL.

            This parameter takes a Company Profile URL. Default value of this parameter is `null`.
          example: https://www.linkedin.com/company/apple
          schema:
            type: string
        - in: query
          name: current_job_description
          required: false
          description: Filter people with **current** job descriptions matching the provided search expression.
          example: education
          schema:
            type: string
        - in: query
          name: past_job_description
          required: false
          description: Filter people with **past** job descriptions matching the provided search expression.
          example: education
          schema:
            type: string
        - in: query
          name: current_company_name
          required: false
          description: Filter people who are **currently** working at a company whose name matches the provided search expression.
          example: Stripe OR Apple
          schema:
            type: string
        - in: query
          name: past_company_name
          required: false
          description: Filter people who **have previously** worked at a company whose name matches the provided search expression.
          example: Stripe OR Apple
          schema:
            type: string
        - in: query
          name: groups
          required: false
          description: Filter people who are members of groups whose names match the provided search expression.
          example: haskell
          schema:
            type: string
        - in: query
          name: languages
          required: false
          description: Filter people who list a language matching the provided search expression.
          example: Mandarin OR Chinese
          schema:
            type: string
        - in: query
          name: region
          required: false
          description: >-
            Filter people located in a region matching the provided search expression.
            A “region” in this context means “state,” “province,” or similar political division, depending on what country you’re querying.
          example: California or Washington
          schema:
            type: string
        - in: query
          name: city
          required: false
          description: Filter people located in a city matching the provided search expression.
          example: Seattle OR "Palo Alto"
          schema:
            type: string
        - in: query
          name: headline
          required: false
          description: Filter people whose headline fields match the provided search expression.
          example: founder
          schema:
            type: string
        - in: query
          name: summary
          required: false
          description: Filter people whose summary fields match the provided search expression.
          example: founder
          schema:
            type: string
        - in: query
          name: industries
          required: false
          description: Person's inferred industry. May sometimes exist when `current_company_industry` does not, but `current_company_industry` should be preferred when it exists.
          example: technology and software
          schema:
            type: string
        - in: query
          name: interests
          required: false
          description: Filter people whose interest fields match the provided search expression.
          example: technology
          schema:
            type: string
        - in: query
          name: skills
          required: false
          description: Filter people whose skill fields match the provided search expression.
          example: accounting
          schema:
            type: string
        - in: query
          name: skills_all_in_list
          required: false
          description: >-
            Filter people whose skill fields match all the skills in the list.

            This parameter accepts a comma-separated list of skills and returns profiles that include all the skills in the list.

            This parameter can't be combined with the `skills` parameter. Please only use one of them.
          example: rust,mongodb
          schema:
            type: string
        - in: query
          name: current_company_country
          required: false
          description: >-
            Filter people who are currently working at a company with an office based in this country.

            This parameter accepts a case-insensitive [Alpha-2 ISO3166 country code](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2).
          example: US
          schema:
            type: string
        - in: query
          name: current_company_region
          required: false
          description: Filter people who are currently working at a company based in a region matching the provided search expression.
          example: Texas
          schema:
            type: string
        - in: query
          name: current_company_city
          required: false
          description: Filter people who are currently working at a company based in a city matching the provided search expression.
          example: Seattle OR "Los Angeles"
          schema:
            type: string
        - in: query
          name: current_company_type
          required: false
          description: >-
            Filter people who are currently working at a company of the provided type.

            Possible values:

            * `EDUCATIONAL`: Educational Institution

            * `GOVERNMENT_AGENCY`: Government Agency

            * `NON_PROFIT` : Nonprofit

            * `PARTNERSHIP` : Partnership

            * `PRIVATELY_HELD` : Privately Held

            * `PUBLIC_COMPANY` : Public Company

            * `SELF_EMPLOYED` : Self-Employed

            * `SELF_OWNED` : Sole Proprietorship
          example: NON_PROFIT
          schema:
            type: string
        - in: query
          name: current_company_follower_count_min
          required: false
          description: Filter people who are currently working at a company with a follower count of **more than** this value.
          example: '100000'
          schema:
            type: string
        - in: query
          name: current_company_follower_count_max
          required: false
          description: Filter people who are currently working at a company with a follower count **less than** this value.
          example: '1000'
          schema:
            type: string
        - in: query
          name: current_company_industry
          required: false
          description: >-
            Filter people who are currently working at a company belonging to an `industry` that matches the provided search expression. The `industry` attribute, found in a Company profile, describes the primary industry in which the company operates. The value of this attribute is an enumerator. [See the full list of possible values for this attribute](/docs/guides/industry-values).

            We also infer a company's industry from various attributes. For example, the primary industry for `https://www.linkedin.com/company/apple` may be `Computers and Electronics Manufacturing`, but we may also classify it under `Software Development`.

            If you want to filter by the primary industry only, please refer to the `current_company_primary_industry` parameter.
          example: higher AND education
          schema:
            type: string
        - in: query
          name: current_company_primary_industry
          required: false
          description: Filter people who are currently working at a company belonging to an `industry` that matches the provided search expression. The `industry` attribute, found in a Company profile, describes the primary industry in which the company operates. The value of this attribute is an enumerator. [See the full list of possible values for this attribute](/docs/guides/industry-values).
          example: technology
          schema:
            type: string
        - in: query
          name: current_company_specialities
          required: false
          description: >-
            Filter people who are currently working at a company with a specialty matching the provided search expression.

            Please note that we use the spelling `specialities` rather than `specialties` in this document.
          example: innovative product development
          schema:
            type: string
        - in: query
          name: current_company_employee_count_category
          required: false
          description: >-
            Filter people who are currently working at a company in this employee count category.

            This parameter will take precedence over `current_company_employee_count_min` and `current_company_employee_count_max` parameters.

            The valid values are:

            - `custom` (default): uses `current_company_employee_count_min` and `current_company_employee_count_max` parameters

            - `startup`: 1-10 employees

            - `small`: 11-50 employees

            - `medium`: 51-250 employees

            - `large`: 251-1000 employees

            - `enterprise`: 1001+ employees
          example: startup
          schema:
            type: string
        - in: query
          name: current_company_employee_count_min
          required: false
          description: Filter people who are currently working at a company with **at least** this many employees.
          example: '1000'
          schema:
            type: string
        - in: query
          name: current_company_employee_count_max
          required: false
          description: Filter people who are currently working at a company with **at most** this many employees.
          example: '1000'
          schema:
            type: string
        - in: query
          name: current_company_description
          required: false
          description: Filter people who are currently working at a company with a description matching the provided search expression.
          example: medical device
          schema:
            type: string
        - in: query
          name: current_company_founded_after_year
          required: false
          description: Filter people who are currently working at a company that was founded **after** this year.
          example: '1999'
          schema:
            type: string
        - in: query
          name: current_company_founded_before_year
          required: false
          description: Filter people who are currently working at a company that was founded **before** this year.
          example: '1999'
          schema:
            type: string
        - in: query
          name: current_company_funding_amount_min
          required: false
          description: Filter people who are currently working at a company that has raised **at least** this much (USD) funding amount.
          example: '1000000'
          schema:
            type: string
        - in: query
          name: current_company_funding_amount_max
          required: false
          description: Filter people who are currently working at a company that has raised **at most** this much (USD) funding amount.
          example: '1000000'
          schema:
            type: string
        - in: query
          name: current_company_funding_raised_after
          required: false
          description: Filter people who are currently working at a company that has raised funding **after** this date.
          example: '2019-12-30'
          schema:
            type: string
        - in: query
          name: current_company_funding_raised_before
          required: false
          description: Filter people who are currently working at a company that has raised funding **before** this date.
          example: '2019-12-30'
          schema:
            type: string
        - in: query
          name: current_company_domain_name
          required: false
          description: Filter people who are currently working at a company with a domain name matching the provided search expression.
          example: pfizer.com
          schema:
            type: string
        - in: query
          name: public_identifier_in_list
          required: false
          description: >-
            A list of public identifiers (the identifying portion of the person’s profile URL).
            The target person’s identifier must be a member of this list.
          example: williamhgates,satyanadella
          schema:
            type: string
        - in: query
          name: public_identifier_not_in_list
          required: false
          description: >-
            A list of public identifiers (the identifying portion of the person’s profile URL).
            The target person’s identifier must **not** be a member of this list.
          example: mark-zuckerberg-618bba58,jeff-bezos-879307323
          schema:
            type: string
        - in: query
          name: page_size
          required: false
          description: >-
            Tune the maximum results returned per API call.

            The default value of this parameter is `100`.

            Accepted values for this parameter is an integer ranging from `1` to `100`.

            When `enrich_profiles=enrich`, this parameter accepts value ranging from `1` to `10`.
          example: '10'
          schema:
            type: string
        - in: query
          name: follower_count_min
          required: false
          description: Filter people with a follower count of **more than** this value.
          example: '1000'
          schema:
            type: string
        - in: query
          name: follower_count_max
          required: false
          description: Filter people with a follower count **less than** this value.
          example: '1000'
          schema:
            type: string
        - in: query
          name: enrich_profiles
          required: false
          description: >-
            Get the person's complete profile data rather than just the URLs to their profiles.

            Each request respond with a streaming response of profiles.

            The valid values are:

            * `skip` (default): lists person's profile url only

            * `enrich`: include person's profile data in the list

            Calling this API endpoint with this parameter would add `1` credit per enriched result returned.
            A profile returned without enrichment will not incur any per-profile charges.
          example: enrich
          schema:
            type: string
        - in: query
          name: use_cache
          required: false
          description: >-
            Define the freshness guarantee on the results returned.

            This parameter accepts the following values:
            if-present (default value) - Returns result as it is without any freshness guarantee
            if-recent - Will make a best effort to return results of profiles no older than 29 days. Costs 1 extra credit
            per result on top of the base cost of the endpoint for users on the Growth or larger subscription. For all other
            users, it will cost 2 extra credits per result on top of the base cost of the endpoint.

            Note: If use_cache=if-recent, page_size is limited to a value of 10 or smaller.
          example: if-present
          schema:
            type: string
        - in: query
          name: next_token
          required: false
          description: >-
            The token for fetching the next page of results.

            Take the value of the `next_token` query parameter from the `next_page` URL of the previous response.

            When this parameter is provided, the search query is restored from the token. Filter parameters are not applied to the search, but they must still be syntactically valid, otherwise the request fails with a 400; only `page_size`, `enrich_profiles` and `use_cache` are honored.
          schema:
            type: string
